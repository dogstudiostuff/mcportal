<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Portal</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #121212; color: white; margin: 0; text-align: center; }
        .box { border: 2px solid #4CAF50; padding: 2rem; border-radius: 15px; max-width: 80%; }
        h1 { color: #4CAF50; }
    </style>
</head>
<body>
    <div class="box">
        <h1>MC Portal</h1>
        <p id="status">Install to Home Screen to enable Sharing</p>
    </div>

    <script>
        // Register the Service Worker (Required for PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // Handle the incoming shared file
        if ('launchQueue' in window) {
            launchQueue.setConsumer(async (params) => {
                if (params.files && params.files.length > 0) {
                    document.getElementById('status').innerText = "Processing file...";
                    
                    const fileHandle = params.files[0];
                    const file = await fileHandle.getFile();
                    
                    // Create a link and click it to force it into the Downloads folder
                    const url = URL.createObjectURL(file);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = file.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    
                    document.getElementById('status').innerText = "✅ Saved: " + file.name;
                }
            });
        }
    </script>
</body>
</html>
